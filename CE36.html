    // ============================================================
    //  工具函数
    // ============================================================
    function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    // ============================================================
    //  核心逻辑
    // ============================================================
    let currentQuestions = [];          // 当前显示的数据（已打乱顺序和选项）
    let hasSubmitted = false;

    function initQuestions() {
        // 深拷贝原始数据
        currentQuestions = RAW_QUESTIONS.map(q => ({
            question: q.question,
            options: [...q.options],
            correct: q.correct
        }));

        // 打乱题目顺序
        shuffleArray(currentQuestions);

        // 对每一题打乱选项顺序，并更新 correct 索引
        currentQuestions.forEach(q => {
            const correctText = q.options[q.correct];
            shuffleArray(q.options);
            q.correct = q.options.indexOf(correctText);  // 重新定位
        });

        hasSubmitted = false;
        document.getElementById('result').classList.remove('show');
        document.getElementById('submitBtn').disabled = false;
    }

    // 渲染所有题目
    function renderQuestions() {
        const container = document.getElementById('questions');
        container.innerHTML = '';
        const total = currentQuestions.length;

        currentQuestions.forEach((q, idx) => {
            const qDiv = document.createElement('div');
            qDiv.className = 'question-item';
            qDiv.dataset.index = idx;

            // 头部：显示当前题号 + 原始题号（用于参考）
            const header = document.createElement('div');
            header.className = 'q-header';
            const originalId = RAW_QUESTIONS.indexOf(
                RAW_QUESTIONS.find(rq => rq.question === q.question) // 通过问题文本匹配原始题号（不严谨但够用）
            ) + 1;
            // 更好的方式：在数据中存储原始ID，但为了简便，我们通过问题文本查找
            // 但可能存在重复问题文本？没有，所以安全。
            header.innerHTML = `
                <span>第 ${idx + 1} / ${total} 题</span>
                <span class="q-original">原题号 #${originalId}</span>
            `;
            qDiv.appendChild(header);

            // 题目文本
            const qText = document.createElement('div');
            qText.className = 'q-text';
            qText.textContent = q.question;
            qDiv.appendChild(qText);

            // 选项
            const optContainer = document.createElement('div');
            optContainer.className = 'options';

            const letters = ['A', 'B', 'C', 'D'];
            q.options.forEach((optText, optIdx) => {
                const label = document.createElement('label');
                label.className = 'option-label';

                const radio = document.createElement('input');
                radio.type = 'radio';
                radio.name = `q_${idx}`;
                radio.value = optIdx;
                radio.required = false; // 不强制

                const letterSpan = document.createElement('span');
                letterSpan.className = 'letter';
                letterSpan.textContent = letters[optIdx] + '.';

                const textSpan = document.createElement('span');
                textSpan.className = 'text';
                textSpan.textContent = optText;

                label.appendChild(radio);
                label.appendChild(letterSpan);
                label.appendChild(textSpan);
                optContainer.appendChild(label);
            });

            qDiv.appendChild(optContainer);

            // 结果指示（提交后显示）
            const resultDiv = document.createElement('div');
            resultDiv.className = 'result-indicator';
            resultDiv.style.display = 'none';
            resultDiv.id = `result_${idx}`;
            qDiv.appendChild(resultDiv);

            container.appendChild(qDiv);
        });
    }

    // 提交答案
    function submitAnswers() {
        if (hasSubmitted) return;
        const total = currentQuestions.length;
        let correctCount = 0;
        let wrongCount = 0;
        let unanswered = 0;

        // 遍历每一题
        currentQuestions.forEach((q, idx) => {
            const qDiv = document.querySelector(`.question-item[data-index="${idx}"]`);
            const radioGroup = qDiv.querySelectorAll(`input[name="q_${idx}"]`);
            let selectedValue = null;
            for (let radio of radioGroup) {
                if (radio.checked) {
                    selectedValue = parseInt(radio.value, 10);
                    break;
                }
            }

            const resultDiv = document.getElementById(`result_${idx}`);
            resultDiv.style.display = 'inline-block';

            const isCorrect = (selectedValue === q.correct);

            // 移除之前的样式
            qDiv.classList.remove('correct', 'wrong', 'unanswered');

            if (selectedValue === null) {
                // 未作答
                unanswered++;
                qDiv.classList.add('unanswered');
                resultDiv.innerHTML = `⚠️ 未作答 · 正确答案：<span class="correct-answer">${q.options[q.correct]}</span>`;
            } else if (isCorrect) {
                correctCount++;
                qDiv.classList.add('correct');
                resultDiv.innerHTML = `✅ 正确！`;
            } else {
                wrongCount++;
                qDiv.classList.add('wrong');
                resultDiv.innerHTML = `❌ 错误 · 正确答案：<span class="correct-answer">${q.options[q.correct]}</span>`;
            }
        });

        // 显示结果面板
        const resultPanel = document.getElementById('result');
        resultPanel.classList.add('show');
        document.getElementById('correctCount').textContent = correctCount;
        document.getElementById('wrongCount').textContent = wrongCount;
        document.getElementById('scoreDisplay').textContent = correctCount;
        document.getElementById('totalDisplay').textContent = total;

        // 禁用提交按钮
        document.getElementById('submitBtn').disabled = true;
        hasSubmitted = true;
    }

    // 重置
    function resetQuiz() {
        initQuestions();
        renderQuestions();
        // 滚动到顶部
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // ============================================================
    //  启动
    // ============================================================
    document.addEventListener('DOMContentLoaded', function() {
        document.getElementById('totalQ').textContent = RAW_QUESTIONS.length;
        document.getElementById('pointsPer').textContent = '1';

        initQuestions();
        renderQuestions();

        document.getElementById('submitBtn').addEventListener('click', submitAnswers);
        document.getElementById('resetBtn').addEventListener('click', resetQuiz);
    });
</script>
