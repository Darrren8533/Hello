<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>贪吃蛇游戏</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #f0f0f0;
      margin: 0;
      padding: 20px;
    }
    
    h1 {
      color: #333;
      margin-bottom: 20px;
    }
    
    .game-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    
    #game-board {
      width: 400px;
      height: 400px;
      border: 2px solid #333;
      background-color: #222;
      position: relative;
    }
    
    .snake-part {
      position: absolute;
      width: 20px;
      height: 20px;
      background-color: #4CAF50;
      border-radius: 4px;
    }
    
    .snake-head {
      background-color: #388E3C;
    }
    
    .food {
      position: absolute;
      width: 20px;
      height: 20px;
      background-color: #F44336;
      border-radius: 50%;
    }
    
    .game-info {
      display: flex;
      justify-content: space-between;
      width: 400px;
      margin-bottom: 10px;
    }
    
    .game-info div {
      font-size: 18px;
      font-weight: bold;
    }
    
    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 20px;
    }
    
    button {
      padding: 10px 15px;
      font-size: 16px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    
    button:hover {
      background-color: #45a049;
    }
    
    button:disabled {
      background-color: #cccccc;
      cursor: not-allowed;
    }
    
    .game-over {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 20px;
      border-radius: 10px;
      z-index: 100;
      width: 300px;
    }
    
    .game-over h2 {
      margin-top: 0;
    }
    
    .instruction {
      background-color: #fff;
      padding: 15px;
      border-radius: 5px;
      margin: 20px auto;
      max-width: 400px;
      text-align: left;
    }
    
    .instruction h2 {
      margin-top: 0;
    }
    
    .instruction ul {
      padding-left: 20px;
    }
    
    /* 虚拟按键 - 用于移动设备 */
    .mobile-controls {
      display: none;
      grid-template-areas: 
        ". up ."
        "left . right"
        ". down .";
      grid-gap: 10px;
      margin-top: 20px;
    }
    
    .mobile-controls button {
      font-size: 20px;
      padding: 15px;
      width: 60px;
      height: 60px;
    }
    
    .mobile-controls .up { grid-area: up; }
    .mobile-controls .down { grid-area: down; }
    .mobile-controls .left { grid-area: left; }
    .mobile-controls .right { grid-area: right; }
    
    @media (max-width: 600px) {
      #game-board {
        width: 320px;
        height: 320px;
      }
      
      .game-info {
        width: 320px;
      }
      
      .mobile-controls {
        display: grid;
      }
    }
  </style>
</head>
<body>
  <h1>贪吃蛇游戏</h1>
  
  <div class="game-container">
    <div class="game-info">
      <div>分数: <span id="score">0</span></div>
      <div>最高分: <span id="high-score">0</span></div>
    </div>
    
    <div id="game-board"></div>
    
    <div class="controls">
      <button id="start-button">开始游戏</button>
      <button id="pause-button" disabled>暂停</button>
      <button id="reset-button" disabled>重置</button>
    </div>
    
    <div class="mobile-controls">
      <button class="up">↑</button>
      <button class="left">←</button>
      <button class="right">→</button>
      <button class="down">↓</button>
    </div>
  </div>
  
  <div class="instruction">
    <h2>游戏说明</h2>
    <ul>
      <li>使用方向键 ↑ ← ↓ → 控制蛇的移动</li>
      <li>吃掉红色食物增加分数</li>
      <li>撞到墙壁或自己身体会导致游戏结束</li>
      <li>按空格键暂停/继续游戏</li>
      <li>移动设备上可使用屏幕下方的方向按钮</li>
    </ul>
  </div>
  
  <div id="game-over" class="game-over">
    <h2>游戏结束!</h2>
    <p>最终分数: <span id="final-score">0</span></p>
    <button id="play-again">再玩一次</button>
  </div>
  
  <script>
    // 游戏常量
    const BOARD_SIZE = 400;
    const GRID_SIZE = 20;
    const GRID_COUNT = BOARD_SIZE / GRID_SIZE;
    
    // 游戏元素
    const gameBoard = document.getElementById('game-board');
    const scoreElement = document.getElementById('score');
    const highScoreElement = document.getElementById('high-score');
    const startButton = document.getElementById('start-button');
    const pauseButton = document.getElementById('pause-button');
    const resetButton = document.getElementById('reset-button');
    const gameOverElement = document.getElementById('game-over');
    const finalScoreElement = document.getElementById('final-score');
    const playAgainButton = document.getElementById('play-again');
    
    // 移动设备控制按钮
    const mobileControls = document.querySelectorAll('.mobile-controls button');
    
    // 游戏变量
    let snake = [];
    let food = {};
    let direction = 'right';
    let nextDirection = 'right';
    let gameInterval;
    let gameSpeed = 150; // 初始速度(毫秒)
    let score = 0;
    let highScore = 0; // 不使用localStorage
    let isPaused = false;
    let isGameOver = false;
    
    // 初始化游戏
    function initGame() {
      // 重置游戏状态
      clearInterval(gameInterval);
      snake = [
        { x: 6 * GRID_SIZE, y: 10 * GRID_SIZE },
        { x: 5 * GRID_SIZE, y: 10 * GRID_SIZE },
        { x: 4 * GRID_SIZE, y: 10 * GRID_SIZE }
      ];
      direction = 'right';
      nextDirection = 'right';
      score = 0;
      isPaused = false;
      isGameOver = false;
      gameSpeed = 150;
      
      // 更新分数显示
      scoreElement.textContent = score;
      highScoreElement.textContent = highScore;
      
      // 清除游戏板
      gameBoard.innerHTML = '';
      
      // 创建食物
      createFood();
      
      // 渲染初始状态
      renderGame();
      
      // 设置游戏按钮状态
      startButton.disabled = true;
      pauseButton.disabled = false;
      resetButton.disabled = false;
      
      // 隐藏游戏结束界面
      gameOverElement.style.display = 'none';
      
      // 启动游戏循环
      gameInterval = setInterval(gameLoop, gameSpeed);
    }
    
    // 游戏主循环
    function gameLoop() {
      if (isPaused || isGameOver) return;
      
      // 更新方向
      direction = nextDirection;
      
      // 移动蛇
      moveSnake();
      
      // 检查碰撞
      if (checkCollision()) {
        endGame();
        return;
      }
      
      // 检查是否吃到食物
      if (snake[0].x === food.x && snake[0].y === food.y) {
        // 增加分数
        score += 10;
        scoreElement.textContent = score;
        
        // 更新最高分
        if (score > highScore) {
          highScore = score;
          highScoreElement.textContent = highScore;
          // 移除localStorage使用
        }
        
        // 增加蛇的长度 (不移除尾部)
        createFood();
        
        // 每增加50分加快游戏速度
        if (score % 50 === 0) {
          gameSpeed = Math.max(50, gameSpeed - 10);
          clearInterval(gameInterval);
          gameInterval = setInterval(gameLoop, gameSpeed);
        }
      } else {
        // 移除蛇的尾部
        snake.pop();
      }
      
      // 渲染游戏
      renderGame();
    }
    
    // 移动蛇
    function moveSnake() {
      const head = Object.assign({}, snake[0]); // 复制头部
      
      // 根据方向移动头部
      switch (direction) {
        case 'up':
          head.y -= GRID_SIZE;
          break;
        case 'down':
          head.y += GRID_SIZE;
          break;
        case 'left':
          head.x -= GRID_SIZE;
          break;
        case 'right':
          head.x += GRID_SIZE;
          break;
      }
      
      // 将新头部添加到蛇的前面
      snake.unshift(head);
    }
    
    // 检查碰撞
    function checkCollision() {
      const head = snake[0];
      
      // 检查墙壁碰撞
      if (
        head.x < 0 ||
        head.x >= BOARD_SIZE ||
        head.y < 0 ||
        head.y >= BOARD_SIZE
      ) {
        return true;
      }
      
      // 检查自身碰撞 (从第5个部分开始检查，避免误判)
      for (let i = 4; i < snake.length; i++) {
        if (head.x === snake[i].x && head.y === snake[i].y) {
          return true;
        }
      }
      
      return false;
    }
    
    // 创建食物
    function createFood() {
      // 删除旧的食物元素
      const oldFood = document.querySelector('.food');
      if (oldFood) {
        oldFood.remove();
      }
      
      // 随机位置
      let newFood;
      let onSnake;
      
      do {
        onSnake = false;
        newFood = {
          x: Math.floor(Math.random() * GRID_COUNT) * GRID_SIZE,
          y: Math.floor(Math.random() * GRID_COUNT) * GRID_SIZE
        };
        
        // 确保食物不会出现在蛇身上
        for (const part of snake) {
          if (part.x === newFood.x && part.y === newFood.y) {
            onSnake = true;
            break;
          }
        }
      } while (onSnake);
      
      food = newFood;
      
      // 创建食物DOM元素
      const foodElement = document.createElement('div');
      foodElement.className = 'food';
      foodElement.style.left = `${food.x}px`;
      foodElement.style.top = `${food.y}px`;
      gameBoard.appendChild(foodElement);
    }
    
    // 渲染游戏
    function renderGame() {
      // 清除旧的蛇
      const oldSnake = document.querySelectorAll('.snake-part');
      oldSnake.forEach(part => part.remove());
      
      // 渲染蛇
      snake.forEach((part, index) => {
        const snakePart = document.createElement('div');
        snakePart.className = 'snake-part';
        if (index === 0) {
          snakePart.classList.add('snake-head');
        }
        snakePart.style.left = `${part.x}px`;
        snakePart.style.top = `${part.y}px`;
        gameBoard.appendChild(snakePart);
      });
    }
    
    // 暂停游戏
    function togglePause() {
      isPaused = !isPaused;
      pauseButton.textContent = isPaused ? '继续' : '暂停';
    }
    
    // 结束游戏
    function endGame() {
      isGameOver = true;
      clearInterval(gameInterval);
      
      // 显示游戏结束界面
      finalScoreElement.textContent = score;
      gameOverElement.style.display = 'block';
      
      // 重置按钮状态
      startButton.disabled = false;
      pauseButton.disabled = true;
    }
    
    // 键盘控制
    function handleKeydown(e) {
      // 只在游戏中时阻止方向键滚动页面
      if (!isGameOver && !startButton.disabled && 
          ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
        e.preventDefault();
      }
      
      // 游戏控制
      if (e.key === ' ') {
        if (!isGameOver && !startButton.disabled) {
          togglePause();
        }
        return;
      }
      
      // 方向控制 (防止180度转弯)
      switch (e.key) {
        case 'ArrowUp':
          if (direction !== 'down') {
            nextDirection = 'up';
          }
          break;
        case 'ArrowDown':
          if (direction !== 'up') {
            nextDirection = 'down';
          }
          break;
        case 'ArrowLeft':
          if (direction !== 'right') {
            nextDirection = 'left';
          }
          break;
        case 'ArrowRight':
          if (direction !== 'left') {
            nextDirection = 'right';
          }
          break;
      }
    }
    
    // 移动设备控制
    function setupMobileControls() {
      document.querySelector('.mobile-controls .up').addEventListener('click', () => {
        if (direction !== 'down') {
          nextDirection = 'up';
        }
      });
      
      document.querySelector('.mobile-controls .down').addEventListener('click', () => {
        if (direction !== 'up') {
          nextDirection = 'down';
        }
      });
      
      document.querySelector('.mobile-controls .left').addEventListener('click', () => {
        if (direction !== 'right') {
          nextDirection = 'left';
        }
      });
      
      document.querySelector('.mobile-controls .right').addEventListener('click', () => {
        if (direction !== 'left') {
          nextDirection = 'right';
        }
      });
    }
    
    // 调整游戏板大小
    function adjustBoardSize() {
      const isMobile = window.innerWidth <= 600;
      if (isMobile) {
        gameBoard.style.width = '320px';
        gameBoard.style.height = '320px';
        document.querySelector('.game-info').style.width = '320px';
      } else {
        gameBoard.style.width = '400px';
        gameBoard.style.height = '400px';
        document.querySelector('.game-info').style.width = '400px';
      }
    }
    
    // 事件监听
    startButton.addEventListener('click', initGame);
    pauseButton.addEventListener('click', togglePause);
    resetButton.addEventListener('click', initGame);
    playAgainButton.addEventListener('click', initGame);
    document.addEventListener('keydown', handleKeydown);
    window.addEventListener('resize', adjustBoardSize);
    
    // 设置移动设备控制
    setupMobileControls();
    
    // 初始调整大小
    adjustBoardSize();
    
    // 显示最高分
    highScoreElement.textContent = highScore;
  </script>
</body>
</html>
