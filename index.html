<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>游戏大厅</title>
  <style>
    :root {
      --primary-color: #4361ee;
      --secondary-color: #3a0ca3;
      --accent-color: #f72585;
      --background-color: #f8f9fa;
      --card-bg-color: #ffffff;
      --text-color: #333333;
      --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      --border-radius: 12px;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--background-color);
      color: var(--text-color);
      line-height: 1.6;
      padding: 20px;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    
    header {
      text-align: center;
      margin-bottom: 40px;
      padding: 20px;
    }
    
    h1 {
      font-size: 2.8rem;
      margin-bottom: 15px;
      color: var(--secondary-color);
    }
    
    .sub-title {
      font-size: 1.2rem;
      color: #666;
      max-width: 700px;
      margin: 0 auto;
    }
    
    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 30px;
      margin-bottom: 60px;
    }
    
    .game-card {
      background-color: var(--card-bg-color);
      border-radius: var(--border-radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    
    .game-card:hover {
      transform: translateY(-10px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
    }
    
    .game-image {
      width: 100%;
      height: 200px;
      object-fit: cover;
      display: block;
    }
    
    .game-content {
      padding: 20px;
    }
    
    .game-title {
      font-size: 1.5rem;
      margin-bottom: 10px;
      color: var(--primary-color);
    }
    
    .game-description {
      margin-bottom: 20px;
      color: #555;
    }
    
    .game-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      font-size: 0.9rem;
      color: #777;
    }
    
    .play-button {
      display: inline-block;
      background-color: var(--primary-color);
      color: white;
      text-decoration: none;
      padding: 10px 20px;
      border-radius: 50px;
      font-weight: bold;
      text-align: center;
      transition: background-color 0.3s ease;
    }
    
    .play-button:hover {
      background-color: var(--secondary-color);
    }
    
    .popular-tag {
      background-color: var(--accent-color);
      color: white;
      font-size: 0.8rem;
      padding: 5px 10px;
      border-radius: 20px;
      position: absolute;
      top: 15px;
      right: 15px;
    }
    
    .footer {
      text-align: center;
      padding: 20px;
      margin-top: 40px;
      border-top: 1px solid #eee;
    }
    
    /* 响应式设计 */
    @media (max-width: 768px) {
      .games-grid {
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 20px;
      }
      
      h1 {
        font-size: 2.2rem;
      }
    }
    
    @media (max-width: 480px) {
      .games-grid {
        grid-template-columns: 1fr;
      }
      
      h1 {
        font-size: 1.8rem;
      }
      
      .container {
        padding: 10px;
      }
    }
    
    /* 图片替代 */
    .game-image-placeholder {
      height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      background: linear-gradient(45deg, var(--primary-color), var(--secondary-color));
      color: white;
    }
    
    /* 游戏卡片相对定位，用于放置标签 */
    .game-card {
      position: relative;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>欢迎来到游戏大厅</h1>
      <p class="sub-title">尽情享受这些经典游戏，挑战自我，刷新记录！</p>
    </header>
    
    <main>
      <div class="games-grid">
        <div class="game-card">
          <div class="game-image-placeholder">
            <span>🧱</span>
          </div>
          <span class="popular-tag">热门</span>
          <div class="game-content">
            <h2 class="game-title">俄罗斯方块</h2>
            <div class="game-meta">
              <span>难度: ⭐⭐⭐</span>
              <span>类型: 益智</span>
            </div>
            <p class="game-description">经典的俄罗斯方块游戏，考验你的反应速度和空间思维能力。堆叠方块，消除行数，获得高分！</p>
            <a href="tetris.html" class="play-button">开始游戏</a>
          </div>
        </div>
        
        <div class="game-card">
          <div class="game-image-placeholder">
            <span>🐍</span>
          </div>
          <div class="game-content">
            <h2 class="game-title">贪吃蛇</h2>
            <div class="game-meta">
              <span>难度: ⭐⭐</span>
              <span>类型: 街机</span>
            </div>
            <p class="game-description">控制蛇移动，吃掉食物让蛇变长。但要小心不要撞到墙壁或自己的身体！经典而有趣的游戏体验。</p>
            <a href="snake.html" class="play-button">开始游戏</a>
          </div>
        </div>
        
        <div class="game-card">
          <div class="game-image-placeholder">
            <span>🔜</span>
          </div>
          <div class="game-content">
            <h2 class="game-title">即将推出</h2>
            <div class="game-meta">
              <span>难度: ?</span>
              <span>类型: 未知</span>
            </div>
            <p class="game-description">更多精彩游戏即将推出，敬请期待！我们正在开发新的游戏体验，很快就会与您见面。</p>
            <a href="#" class="play-button" style="background-color: #999;">敬请期待</a>
          </div>
        </div>
      </div>
    </main>
    
    <footer class="footer">
      <p>© 2025 游戏大厅 - 所有游戏仅供娱乐</p>
    </footer>
  </div>
  
  <script>
    // 简单的链接处理，可以根据需要扩展
    document.querySelectorAll('.play-button').forEach(button => {
      button.addEventListener('click', function(e) {
        const href = this.getAttribute('href');
        if (href && href !== '#') {
          e.preventDefault(); // 阻止默认行为
          
          // 在新标签页中打开游戏
          window.open(href, '_blank');
        }
      });
    });
  </script>
</body>
</html>
