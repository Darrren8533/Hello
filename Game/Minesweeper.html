<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>扫雷游戏</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f0f0;
      color: #333;
      line-height: 1.6;
      padding: 20px;
      text-align: center;
    }
    
    .return-button {
      background-color: #2196F3;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 5px;
      cursor: pointer;
      position: absolute;
      top: 20px;
      left: 20px;
      font-size: 16px;
      transition: background-color 0.3s;
    }
    
    .return-button:hover {
      background-color: #0b7dda;
    }
    
    h1 {
      margin: 20px 0;
      font-size: 2.2rem;
      color: #333;
    }
    
    .game-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0 auto;
      max-width: 600px;
    }
    
    .game-info {
      display: flex;
      justify-content: space-between;
      width: 100%;
      margin-bottom: 20px;
      background-color: #fff;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    
    .game-info div {
      display: flex;
      align-items: center;
      font-weight: bold;
      font-size: 1.2rem;
    }
    
    .game-info div span {
      margin-left: 10px;
    }
    
    .difficulty-controls {
      margin-bottom: 20px;
    }
    
    .difficulty-btn {
      background-color: #4CAF50;
      color: white;
      border: none;
      padding: 10px 15px;
      margin: 0 5px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
      transition: background-color 0.3s;
    }
    
    .difficulty-btn:hover {
      background-color: #45a049;
    }
    
    .difficulty-btn.active {
      background-color: #2E7D32;
      box-shadow: 0 0 5px rgba(0,0,0,0.3);
    }
    
    .game-controls {
      margin-bottom: 20px;
    }
    
    .control-btn {
      background-color: #4CAF50;
      color: white;
      border: none;
      padding: 10px 20px;
      margin: 0 5px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
      transition: background-color 0.3s;
    }
    
    .control-btn:hover {
      background-color: #45a049;
    }
    
    .control-btn.reset {
      background-color: #f44336;
    }
    
    .control-btn.reset:hover {
      background-color: #d32f2f;
    }
    
    #mines-grid {
      display: grid;
      border: 2px solid #999;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    
    .cell {
      width: 30px;
      height: 30px;
      border: 1px solid #bbb;
      background-color: #ddd;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      cursor: pointer;
      user-select: none;
    }
    
    .cell:hover {
      background-color: #ccc;
    }
    
    .cell.revealed {
      background-color: #f5f5f5;
    }
    
    .cell.mine {
      background-color: #f44336;
    }
    
    .cell.flagged {
      background-color: #ffeb3b;
      position: relative;
    }
    
    .cell.flagged::after {
      content: "🚩";
      font-size: 18px;
    }
    
    .cell[data-count="1"] { color: blue; }
    .cell[data-count="2"] { color: green; }
    .cell[data-count="3"] { color: red; }
    .cell[data-count="4"] { color: darkblue; }
    .cell[data-count="5"] { color: darkred; }
    .cell[data-count="6"] { color: teal; }
    .cell[data-count="7"] { color: black; }
    .cell[data-count="8"] { color: gray; }
    
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
      z-index: 100;
    }
    
    .modal-content {
      background-color: white;
      border-radius: 10px;
      padding: 30px;
      text-align: center;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      max-width: 400px;
      width: 80%;
    }
    
    .modal h2 {
      margin-bottom: 20px;
      font-size: 1.8rem;
    }
    
    .modal p {
      margin-bottom: 25px;
      font-size: 1.1rem;
    }
    
    .modal-btns {
      display: flex;
      justify-content: center;
      gap: 15px;
    }
    
    .modal-btn {
      padding: 10px 25px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
      transition: background-color 0.3s;
    }
    
    .modal-btn.primary {
      background-color: #4CAF50;
      color: white;
    }
    
    .modal-btn.primary:hover {
      background-color: #45a049;
    }
    
    .modal-btn.secondary {
      background-color: #2196F3;
      color: white;
    }
    
    .modal-btn.secondary:hover {
      background-color: #0b7dda;
    }
    
    .instructions {
      max-width: 600px;
      margin: 30px auto;
      background-color: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      text-align: left;
    }
    
    .instructions h2 {
      text-align: center;
      margin-bottom: 15px;
    }
    
    .instructions ul {
      margin-left: 25px;
    }
    
    .instructions li {
      margin-bottom: 8px;
    }
    
    @media (max-width: 600px) {
      .game-info {
        flex-direction: column;
        gap: 10px;
      }
      
      .cell {
        width: 25px;
        height: 25px;
        font-size: 12px;
      }
      
      .difficulty-controls, .game-controls {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px;
      }
      
      .difficulty-btn, .control-btn {
        margin: 0;
      }
      
      .instructions {
        padding: 15px;
      }
      
      .return-button {
        position: static;
        margin-bottom: 10px;
      }
    }
  </style>
</head>
<body>
  <button id="return-button" class="return-button">返回游戏大厅</button>
  
  <h1>扫雷游戏</h1>
  
  <div class="game-container">
    <div class="game-info">
      <div>剩余地雷: <span id="mines-left">10</span></div>
      <div>用时: <span id="timer">0</span>秒</div>
    </div>
    
    <div class="difficulty-controls">
      <button class="difficulty-btn active" data-difficulty="easy">简单</button>
      <button class="difficulty-btn" data-difficulty="medium">中等</button>
      <button class="difficulty-btn" data-difficulty="hard">困难</button>
      <button class="difficulty-btn" data-difficulty="expert">专家</button>
    </div>
    
    <div class="game-controls">
      <button id="new-game-btn" class="control-btn">新游戏</button>
      <button id="reset-btn" class="control-btn reset">重置</button>
    </div>
    
    <div id="mines-grid"></div>
  </div>
  
  <div class="instructions">
    <h2>游戏说明</h2>
    <ul>
      <li><strong>目标:</strong> 标记出所有地雷的位置，并揭开所有不含地雷的方格。</li>
      <li><strong>左键点击:</strong> 揭开一个方格。如果该方格有地雷，游戏结束。</li>
      <li><strong>右键点击:</strong> 标记/取消标记一个可能含有地雷的方格。</li>
      <li><strong>数字含义:</strong> 揭开的方格上的数字表示周围8个方格中含有的地雷数量。</li>
      <li><strong>战略提示:</strong> 使用周围已揭开的数字来推断哪些方格可能含有地雷。</li>
    </ul>
  </div>
  
  <div id="game-over-modal" class="modal">
    <div class="modal-content">
      <h2 id="modal-title">游戏结束</h2>
      <p id="modal-message">你踩到了地雷！</p>
      <div class="modal-btns">
        <button id="play-again-btn" class="modal-btn primary">再玩一次</button>
        <button id="return-hub-btn" class="modal-btn secondary">返回游戏大厅</button>
      </div>
    </div>
  </div>
  
  <script>
    // 游戏配置
    const difficulties = {
      easy: { rows: 9, cols: 9, mines: 10 },
      medium: { rows: 16, cols: 16, mines: 40 },
      hard: { rows: 16, cols: 30, mines: 99 },
      expert: { rows: 24, cols: 30, mines: 150 }
    };
    
    // 游戏变量
    let gameGrid = [];
    let currentDifficulty = 'easy';
    let config = difficulties[currentDifficulty];
    let minesLeft = config.mines;
    let timerInterval;
    let timeElapsed = 0;
    let gameStarted = false;
    let gameOver = false;
    let firstClick = true;
    let cellsRevealed = 0;
    
    // DOM元素
    const minesGrid = document.getElementById('mines-grid');
    const minesLeftDisplay = document.getElementById('mines-left');
    const timerDisplay = document.getElementById('timer');
    const difficultyBtns = document.querySelectorAll('.difficulty-btn');
    const newGameBtn = document.getElementById('new-game-btn');
    const resetBtn = document.getElementById('reset-btn');
    const modal = document.getElementById('game-over-modal');
    const modalTitle = document.getElementById('modal-title');
    const modalMessage = document.getElementById('modal-message');
    const playAgainBtn = document.getElementById('play-again-btn');
    const returnHubBtn = document.getElementById('return-hub-btn');
    const returnButton = document.getElementById('return-button');
    
    // 初始化游戏
    function initGame() {
      // 重置变量
      gameGrid = [];
      minesLeft = config.mines;
      timeElapsed = 0;
      gameStarted = false;
      gameOver = false;
      firstClick = true;
      cellsRevealed = 0;
      
      // 清除计时器
      clearInterval(timerInterval);
      
      // 更新显示
      minesLeftDisplay.textContent = minesLeft;
      timerDisplay.textContent = '0';
      
      // 创建网格
      createGrid();
    }
    
    // 创建游戏网格
    function createGrid() {
      // 清空网格
      minesGrid.innerHTML = '';
      
      // 设置网格大小
      minesGrid.style.gridTemplateColumns = `repeat(${config.cols}, 30px)`;
      minesGrid.style.gridTemplateRows = `repeat(${config.rows}, 30px)`;
      
      // 初始化游戏数组
      for (let row = 0; row < config.rows; row++) {
        gameGrid[row] = [];
        for (let col = 0; col < config.cols; col++) {
          gameGrid[row][col] = {
            isMine: false,
            isRevealed: false,
            isFlagged: false,
            neighborMines: 0
          };
          
          // 创建单元格元素
          const cell = document.createElement('div');
          cell.className = 'cell';
          cell.dataset.row = row;
          cell.dataset.col = col;
          
          // 添加点击事件
          cell.addEventListener('click', handleCellClick);
          cell.addEventListener('contextmenu', handleRightClick);
          
          // 添加到网格
          minesGrid.appendChild(cell);
        }
      }
    }
    
    // 布置地雷（在首次点击后）
    function placeMines(firstRow, firstCol) {
      let minesPlaced = 0;
      
      // 创建安全区域（首次点击的3x3区域内不放置地雷）
      const safeZone = [];
      for (let r = Math.max(0, firstRow - 1); r <= Math.min(config.rows - 1, firstRow + 1); r++) {
        for (let c = Math.max(0, firstCol - 1); c <= Math.min(config.cols - 1, firstCol + 1); c++) {
          safeZone.push(`${r},${c}`);
        }
      }
      
      // 随机布置地雷
      while (minesPlaced < config.mines) {
        const row = Math.floor(Math.random() * config.rows);
        const col = Math.floor(Math.random() * config.cols);
        
        // 确保不在安全区域内放置地雷
        if (!safeZone.includes(`${row},${col}`) && !gameGrid[row][col].isMine) {
          gameGrid[row][col].isMine = true;
          minesPlaced++;
        }
      }
      
      // 计算每个单元格周围的地雷数
      calculateNeighborMines();
    }
    
    // 计算每个单元格周围的地雷数
    function calculateNeighborMines() {
      for (let row = 0; row < config.rows; row++) {
        for (let col = 0; col < config.cols; col++) {
          if (gameGrid[row][col].isMine) continue;
          
          let count = 0;
          
          // 检查周围8个单元格
          for (let r = Math.max(0, row - 1); r <= Math.min(config.rows - 1, row + 1); r++) {
            for (let c = Math.max(0, col - 1); c <= Math.min(config.cols - 1, col + 1); c++) {
              if (r === row && c === col) continue;
              if (gameGrid[r][c].isMine) count++;
            }
          }
          
          gameGrid[row][col].neighborMines = count;
        }
      }
    }
    
    // 处理单元格点击
    function handleCellClick(e) {
      if (gameOver) return;
      
      const row = parseInt(e.target.dataset.row);
      const col = parseInt(e.target.dataset.col);
      
      // 如果已标记则不揭开
      if (gameGrid[row][col].isFlagged) return;
      
      // 首次点击
      if (firstClick) {
        firstClick = false;
        placeMines(row, col);
        startTimer();
      }
      
      // 揭开单元格
      revealCell(row, col);
    }
    
    // 处理右键点击（标记）
    function handleRightClick(e) {
      e.preventDefault();
      
      if (gameOver || firstClick) return;
      
      const row = parseInt(e.target.dataset.row);
      const col = parseInt(e.target.dataset.col);
      
      // 如果已揭开则不能标记
      if (gameGrid[row][col].isRevealed) return;
      
      // 切换标记状态
      toggleFlag(row, col);
      
      return false;
    }
    
    // 揭开单元格
    function revealCell(row, col) {
      const cell = gameGrid[row][col];
      
      // 如果已揭开或已标记则跳过
      if (cell.isRevealed || cell.isFlagged) return;
      
      // 标记为已揭开
      cell.isRevealed = true;
      cellsRevealed++;
      
      // 更新UI
      const cellElement = document.querySelector(`.cell[data-row="${row}"][data-col="${col}"]`);
      cellElement.classList.add('revealed');
      
      // 检查是否踩到地雷
      if (cell.isMine) {
        cellElement.classList.add('mine');
        cellElement.textContent = '💣';
        endGame(false);
        return;
      }
      
      // 显示周围地雷数
      if (cell.neighborMines > 0) {
        cellElement.textContent = cell.neighborMines;
        cellElement.dataset.count = cell.neighborMines;
      } else {
        // 如果周围没有地雷，自动揭开周围的单元格（递归）
        for (let r = Math.max(0, row - 1); r <= Math.min(config.rows - 1, row + 1); r++) {
          for (let c = Math.max(0, col - 1); c <= Math.min(config.cols - 1, col + 1); c++) {
            if (r === row && c === col) continue;
            revealCell(r, c);
          }
        }
      }
      
      // 检查是否获胜
      checkWinCondition();
    }
    
    // 切换标记状态
    function toggleFlag(row, col) {
      const cell = gameGrid[row][col];
      const cellElement = document.querySelector(`.cell[data-row="${row}"][data-col="${col}"]`);
      
      if (cell.isFlagged) {
        // 移除标记
        cell.isFlagged = false;
        cellElement.classList.remove('flagged');
        minesLeft++;
      } else {
        // 添加标记
        cell.isFlagged = true;
        cellElement.classList.add('flagged');
        minesLeft--;
      }
      
      // 更新剩余地雷显示
      minesLeftDisplay.textContent = minesLeft;
      
      // 检查是否获胜
      checkWinCondition();
    }
    
    // 检查获胜条件
    function checkWinCondition() {
      // 检查所有非地雷单元格是否都已揭开
      const totalCells = config.rows * config.cols;
      const targetRevealed = totalCells - config.mines;
      
      if (cellsRevealed === targetRevealed) {
        // 标记所有未标记的地雷
        for (let row = 0; row < config.rows; row++) {
          for (let col = 0; col < config.cols; col++) {
            if (gameGrid[row][col].isMine && !gameGrid[row][col].isFlagged) {
              toggleFlag(row, col);
            }
          }
        }
        
        endGame(true);
      }
    }
    
    // 开始计时器
    function startTimer() {
      gameStarted = true;
      timerInterval = setInterval(() => {
        timeElapsed++;
        timerDisplay.textContent = timeElapsed;
      }, 1000);
    }
    
    // 结束游戏
    function endGame(isWin) {
      gameOver = true;
      clearInterval(timerInterval);
      
      // 如果失败，显示所有地雷
      if (!isWin) {
        revealAllMines();
      }
      
      // 显示结果消息
      showGameOverModal(isWin);
    }
    
    // 显示所有地雷
    function revealAllMines() {
      for (let row = 0; row < config.rows; row++) {
        for (let col = 0; col < config.cols; col++) {
          if (gameGrid[row][col].isMine && !gameGrid[row][col].isFlagged) {
            const cellElement = document.querySelector(`.cell[data-row="${row}"][data-col="${col}"]`);
            cellElement.classList.add('revealed');
            cellElement.classList.add('mine');
            cellElement.textContent = '💣';
          } else if (gameGrid[row][col].isFlagged && !gameGrid[row][col].isMine) {
            // 标记错误的地雷
            const cellElement = document.querySelector(`.cell[data-row="${row}"][data-col="${col}"]`);
            cellElement.classList.add('revealed');
            cellElement.textContent = '❌';
          }
        }
      }
    }
    
    // 显示游戏结束模态框
    function showGameOverModal(isWin) {
      if (isWin) {
        modalTitle.textContent = '恭喜!';
        modalMessage.textContent = `你成功找出了所有地雷！用时: ${timeElapsed}秒`;
      } else {
        modalTitle.textContent = '游戏结束';
        modalMessage.textContent = '你踩到了地雷！再接再厉！';
      }
      
      modal.style.display = 'flex';
    }
    
    // 关闭模态框
    function closeModal() {
      modal.style.display = 'none';
    }
    
    // 切换难度
    function changeDifficulty(diff) {
      currentDifficulty = diff;
      config = difficulties[diff];
      
      // 更新UI
      difficultyBtns.forEach(btn => {
        if (btn.dataset.difficulty === diff) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });
      
      // 重新初始化游戏
      initGame();
    }
    
    // 事件监听
    difficultyBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        changeDifficulty(btn.dataset.difficulty);
      });
    });
    
    newGameBtn.addEventListener('click', () => {
      initGame();
    });
    
    resetBtn.addEventListener('click', () => {
      initGame();
    });
    
    playAgainBtn.addEventListener('click', () => {
      closeModal();
      initGame();
    });
    
    returnHubBtn.addEventListener('click', () => {
      window.location.href = 'game-hub';
    });
    
    returnButton.addEventListener('click', () => {
      window.location.href = 'index.html';
    });
    
    // 初始化游戏
    initGame();
  </script>
</body>
</html>
