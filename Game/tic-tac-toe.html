<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>井字棋</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f5f7fa;
      color: #333;
      line-height: 1.6;
      padding: 20px;
      text-align: center;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    
    .return-button {
      background-color: #2196F3;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 5px;
      cursor: pointer;
      position: absolute;
      top: 20px;
      left: 20px;
      font-size: 16px;
      transition: background-color 0.3s;
    }
    
    .return-button:hover {
      background-color: #0b7dda;
    }
    
    h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
      color: #2c3e50;
    }
    
    .game-subtitle {
      font-size: 1.2rem;
      margin-bottom: 30px;
      color: #7f8c8d;
    }
    
    .container {
      max-width: 500px;
      margin: 0 auto;
    }
    
    .game-info {
      display: flex;
      justify-content: space-between;
      margin-bottom: 20px;
      font-size: 1.2rem;
    }
    
    .player-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .player-icon {
      font-size: 1.5rem;
      font-weight: bold;
    }
    
    .player-score {
      background-color: #ecf0f1;
      padding: 5px 10px;
      border-radius: 5px;
      font-weight: bold;
    }
    
    .active-player {
      color: #3498db;
      position: relative;
      font-weight: bold;
    }
    
    .active-player::after {
      content: '';
      position: absolute;
      bottom: -5px;
      left: 0;
      width: 100%;
      height: 3px;
      background-color: #3498db;
      border-radius: 3px;
      animation: pulse 1.5s infinite;
    }
    
    @keyframes pulse {
      0% { opacity: 0.6; }
      50% { opacity: 1; }
      100% { opacity: 0.6; }
    }
    
    .game-board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 30px;
      width: 100%;
      max-width: 400px;
      aspect-ratio: 1 / 1;
    }
    
    .cell {
      background-color: white;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 4rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }
    
    .cell:hover {
      transform: translateY(-5px);
      box-shadow: 0 6px 8px rgba(0, 0, 0, 0.15);
    }
    
    .cell.x {
      color: #e74c3c;
    }
    
    .cell.o {
      color: #2980b9;
    }
    
    .cell.winning {
      background-color: #f1c40f;
      animation: winner 1s infinite;
    }
    
    @keyframes winner {
      0% { background-color: #f1c40f; }
      50% { background-color: #f39c12; }
      100% { background-color: #f1c40f; }
    }
    
    .game-controls {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 20px;
    }
    
    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
      color: white;
    }
    
    .btn-new-game {
      background-color: #2ecc71;
    }
    
    .btn-new-game:hover {
      background-color: #27ae60;
    }
    
    .btn-difficulty {
      background-color: #3498db;
    }
    
    .btn-difficulty:hover {
      background-color: #2980b9;
    }
    
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    
    .modal-content {
      background-color: white;
      padding: 30px;
      border-radius: 10px;
      text-align: center;
      max-width: 400px;
      width: 90%;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
      animation: modal-appear 0.3s ease-out;
    }
    
    @keyframes modal-appear {
      from { opacity: 0; transform: translateY(-50px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .modal h2 {
      margin-bottom: 15px;
      color: #2c3e50;
    }
    
    .modal-message {
      font-size: 1.2rem;
      margin-bottom: 25px;
    }
    
    .modal-actions {
      display: flex;
      justify-content: center;
      gap: 15px;
    }
    
    .difficulty-levels {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }
    
    .difficulty-btn {
      padding: 10px;
      border: 2px solid #3498db;
      background-color: white;
      color: #3498db;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .difficulty-btn:hover {
      background-color: #ecf0f1;
    }
    
    .difficulty-btn.active {
      background-color: #3498db;
      color: white;
    }
    
    .instructions {
      max-width: 500px;
      margin: 20px auto;
      background-color: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      text-align: left;
    }
    
    .instructions h2 {
      text-align: center;
      margin-bottom: 15px;
      color: #2c3e50;
    }
    
    .instructions p {
      margin-bottom: 10px;
    }
    
    /* 响应式设计 */
    @media (max-width: 480px) {
      h1 {
        font-size: 2rem;
      }
      
      .game-subtitle {
        font-size: 1rem;
      }
      
      .game-board {
        max-width: 320px;
      }
      
      .cell {
        font-size: 3rem;
      }
      
      .game-controls {
        flex-direction: column;
        gap: 10px;
      }
      
      .return-button {
        position: static;
        margin-bottom: 20px;
      }
    }
  </style>
</head>
<body>
  <button id="return-button" class="return-button">返回游戏大厅</button>
  
  <h1>井字棋</h1>
  <div class="game-subtitle">挑战AI，看谁能赢得三子连线的胜利</div>
  
  <div class="container">
    <div class="game-info">
      <div class="player-info">
        <span class="player-icon">X</span>
        <span class="player-name">玩家</span>
        <span class="player-score" id="player-score">0</span>
      </div>
      <div id="current-turn" class="current-turn">当前回合: <span id="current-player" class="active-player">玩家</span></div>
      <div class="player-info">
        <span class="player-icon">O</span>
        <span class="player-name">AI</span>
        <span class="player-score" id="ai-score">0</span>
      </div>
    </div>
    
    <div class="game-board" id="game-board">
      <div class="cell" data-index="0"></div>
      <div class="cell" data-index="1"></div>
      <div class="cell" data-index="2"></div>
      <div class="cell" data-index="3"></div>
      <div class="cell" data-index="4"></div>
      <div class="cell" data-index="5"></div>
      <div class="cell" data-index="6"></div>
      <div class="cell" data-index="7"></div>
      <div class="cell" data-index="8"></div>
    </div>
    
    <div class="game-controls">
      <button id="new-game-btn" class="btn btn-new-game">新游戏</button>
      <button id="difficulty-btn" class="btn btn-difficulty">难度: 中等</button>
    </div>
  </div>
  
  <div class="instructions">
    <h2>游戏规则</h2>
    <p>1. 游戏在3×3的网格上进行，两名玩家交替放置各自的棋子（X和O）。</p>
    <p>2. 玩家（X）先行，AI（O）后行。</p>
    <p>3. 第一个在水平、垂直或对角线上形成3个相同标记的玩家获胜。</p>
    <p>4. 如果网格填满但没有玩家能够形成三连，则游戏以平局结束。</p>
    <p>5. 点击"难度"按钮可以调整AI的难度级别。</p>
  </div>
  
  <!-- 游戏结果模态框 -->
  <div class="modal" id="result-modal">
    <div class="modal-content">
      <h2 id="result-title">游戏结束</h2>
      <p class="modal-message" id="result-message">平局!</p>
      <div class="modal-actions">
        <button id="play-again-btn" class="btn btn-new-game">再玩一次</button>
        <button id="return-home-btn" class="btn btn-difficulty">返回游戏大厅</button>
      </div>
    </div>
  </div>
  
  <!-- 难度选择模态框 -->
  <div class="modal" id="difficulty-modal">
    <div class="modal-content">
      <h2>选择难度</h2>
      <div class="difficulty-levels">
        <button class="difficulty-btn" data-level="easy">简单</button>
        <button class="difficulty-btn active" data-level="medium">中等</button>
        <button class="difficulty-btn" data-level="hard">困难</button>
        <button class="difficulty-btn" data-level="impossible">无敌</button>
      </div>
      <div class="modal-actions">
        <button id="confirm-difficulty-btn" class="btn btn-new-game">确认</button>
      </div>
    </div>
  </div>
  
  <script>
    // 游戏状态
    const gameState = {
      board: Array(9).fill(''),
      currentPlayer: 'X', // 玩家是X，AI是O
      gameActive: true,
      difficulty: 'medium', // 'easy', 'medium', 'hard', 'impossible'
      scores: {
        X: 0, // 玩家
        O: 0, // AI
        ties: 0
      }
    };
    
    // 获取DOM元素
    const gameBoard = document.getElementById('game-board');
    const cells = document.querySelectorAll('.cell');
    const playerScoreElement = document.getElementById('player-score');
    const aiScoreElement = document.getElementById('ai-score');
    const currentPlayerElement = document.getElementById('current-player');
    const newGameButton = document.getElementById('new-game-btn');
    const difficultyButton = document.getElementById('difficulty-btn');
    const resultModal = document.getElementById('result-modal');
    const resultTitle = document.getElementById('result-title');
    const resultMessage = document.getElementById('result-message');
    const playAgainButton = document.getElementById('play-again-btn');
    const returnHomeButton = document.getElementById('return-home-btn');
    const difficultyModal = document.getElementById('difficulty-modal');
    const difficultyButtons = document.querySelectorAll('.difficulty-btn');
    const confirmDifficultyButton = document.getElementById('confirm-difficulty-btn');
    const returnButton = document.getElementById('return-button');
    
    // 胜利组合
    const winCombinations = [
      [0, 1, 2], [3, 4, 5], [6, 7, 8], // 行
      [0, 3, 6], [1, 4, 7], [2, 5, 8], // 列
      [0, 4, 8], [2, 4, 6]             // 对角线
    ];
    
    // 初始化游戏
    function initGame() {
      // 清空棋盘
      gameState.board = Array(9).fill('');
      gameState.currentPlayer = 'X';
      gameState.gameActive = true;
      
      // 更新UI
      cells.forEach(cell => {
        cell.textContent = '';
        cell.classList.remove('x', 'o', 'winning');
      });
      
      // 更新当前玩家显示
      updateCurrentPlayerDisplay();
    }
    
    // 更新当前玩家显示
    function updateCurrentPlayerDisplay() {
      if (gameState.currentPlayer === 'X') {
        currentPlayerElement.textContent = '玩家';
      } else {
        currentPlayerElement.textContent = 'AI';
      }
    }
    
    // 处理单元格点击
    function handleCellClick(e) {
      const cell = e.target;
      const index = parseInt(cell.dataset.index);
      
      // 检查单元格是否为空，且游戏是否进行中
      if (gameState.board[index] !== '' || !gameState.gameActive || gameState.currentPlayer !== 'X') {
        return;
      }
      
      // 玩家走棋
      makeMove(index, 'X');
      
      // 检查游戏状态
      if (checkGameState()) {
        return;
      }
      
      // AI走棋
      setTimeout(() => {
        if (gameState.gameActive) {
          makeAIMove();
          checkGameState();
        }
      }, 500);
    }
    
    // 走棋
    function makeMove(index, player) {
      gameState.board[index] = player;
      gameState.currentPlayer = player === 'X' ? 'O' : 'X';
      
      // 更新UI
      cells[index].textContent = player;
      cells[index].classList.add(player.toLowerCase());
      
      // 更新当前玩家显示
      updateCurrentPlayerDisplay();
    }
    
    // AI走棋
    function makeAIMove() {
      let index;
      
      switch (gameState.difficulty) {
        case 'easy':
          index = makeRandomMove();
          break;
        case 'medium':
          index = Math.random() < 0.5 ? makeBestMove(2) : makeRandomMove();
          break;
        case 'hard':
          index = Math.random() < 0.2 ? makeRandomMove() : makeBestMove(3);
          break;
        case 'impossible':
          index = makeBestMove(Infinity);
          break;
        default:
          index = makeRandomMove();
      }
      
      makeMove(index, 'O');
    }
    
    // 随机走棋
    function makeRandomMove() {
      const emptyCells = [];
      
      // 查找所有空单元格
      for (let i = 0; i < 9; i++) {
        if (gameState.board[i] === '') {
          emptyCells.push(i);
        }
      }
      
      // 随机选择一个空单元格
      return emptyCells[Math.floor(Math.random() * emptyCells.length)];
    }
    
    // 最佳走棋（极小极大算法）
    function makeBestMove(depth) {
      let bestScore = -Infinity;
      let bestMove;
      
      // 遍历所有空单元格
      for (let i = 0; i < 9; i++) {
        if (gameState.board[i] === '') {
          // 尝试这个位置
          gameState.board[i] = 'O';
          
          // 计算这个位置的分数
          const score = minimax(gameState.board, depth, false);
          
          // 恢复这个位置
          gameState.board[i] = '';
          
          // 更新最佳分数和最佳位置
          if (score > bestScore) {
            bestScore = score;
            bestMove = i;
          }
        }
      }
      
      return bestMove;
    }
    
    // 极小极大算法
    function minimax(board, depth, isMaximizing) {
      // 检查终止条件
      const result = checkWinner(board);
      
      if (result !== null || depth === 0) {
        return getScore(result);
      }
      
      if (isMaximizing) {
        // AI回合（最大化）
        let bestScore = -Infinity;
        
        for (let i = 0; i < 9; i++) {
          if (board[i] === '') {
            board[i] = 'O';
            const score = minimax(board, depth - 1, false);
            board[i] = '';
            bestScore = Math.max(score, bestScore);
          }
        }
        
        return bestScore;
      } else {
        // 玩家回合（最小化）
        let bestScore = Infinity;
        
        for (let i = 0; i < 9; i++) {
          if (board[i] === '') {
            board[i] = 'X';
            const score = minimax(board, depth - 1, true);
            board[i] = '';
            bestScore = Math.min(score, bestScore);
          }
        }
        
        return bestScore;
      }
    }
    
    // 计算分数
    function getScore(result) {
      if (result === 'O') {
        return 10; // AI赢
      } else if (result === 'X') {
        return -10; // 玩家赢
      } else {
        return 0; // 平局或游戏未结束
      }
    }
    
    // 检查游戏状态
    function checkGameState() {
      // 检查游戏是否结束
      const winner = checkWinner(gameState.board);
      
      if (winner !== null) {
        gameState.gameActive = false;
        
        if (winner === 'tie') {
          // 平局
          gameState.scores.ties++;
          showResult('平局', '没有胜负，再来一次吧！');
        } else {
          // 有赢家
          highlightWinningCombination();
          
          if (winner === 'X') {
            // 玩家赢
            gameState.scores.X++;
            playerScoreElement.textContent = gameState.scores.X;
            showResult('恭喜！', '你赢了！');
          } else {
            // AI赢
            gameState.scores.O++;
            aiScoreElement.textContent = gameState.scores.O;
            showResult('游戏结束', 'AI赢了这一局！');
          }
        }
        
        return true;
      }
      
      return false;
    }
    
    // 检查是否有赢家
    function checkWinner(board) {
      // 检查胜利组合
      for (const combo of winCombinations) {
        const [a, b, c] = combo;
        
        if (board[a] && board[a] === board[b] && board[a] === board[c]) {
          return board[a]; // 返回赢家
        }
      }
      
      // 检查是否平局
      if (!board.includes('')) {
        return 'tie';
      }
      
      // 游戏未结束
      return null;
    }
    
    // 高亮显示获胜组合
    function highlightWinningCombination() {
      for (const combo of winCombinations) {
        const [a, b, c] = combo;
        
        if (gameState.board[a] && gameState.board[a] === gameState.board[b] && gameState.board[a] === gameState.board[c]) {
          cells[a].classList.add('winning');
          cells[b].classList.add('winning');
          cells[c].classList.add('winning');
          return;
        }
      }
    }
    
    // 显示结果
    function showResult(title, message) {
      resultTitle.textContent = title;
      resultMessage.textContent = message;
      resultModal.style.display = 'flex';
    }
    
    // 更新难度按钮文本
    function updateDifficultyButtonText() {
      let difficultyText;
      
      switch (gameState.difficulty) {
        case 'easy':
          difficultyText = '简单';
          break;
        case 'medium':
          difficultyText = '中等';
          break;
        case 'hard':
          difficultyText = '困难';
          break;
        case 'impossible':
          difficultyText = '无敌';
          break;
        default:
          difficultyText = '中等';
      }
      
      difficultyButton.textContent = `难度: ${difficultyText}`;
    }
    
    // 事件监听
    cells.forEach(cell => {
      cell.addEventListener('click', handleCellClick);
    });
    
    newGameButton.addEventListener('click', initGame);
    
    playAgainButton.addEventListener('click', () => {
      resultModal.style.display = 'none';
      initGame();
    });
    
    returnHomeButton.addEventListener('click', () => {
      window.location.href = 'index.html';
    });
    
    difficultyButton.addEventListener('click', () => {
      // 显示难度选择模态框
      difficultyModal.style.display = 'flex';
      
      // 更新当前选中难度
      difficultyButtons.forEach(btn => {
        if (btn.dataset.level === gameState.difficulty) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });
    });
    
    difficultyButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        // 更新选中状态
        difficultyButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      });
    });
    
    confirmDifficultyButton.addEventListener('click', () => {
      // 获取选中难度
      const selectedButton = document.querySelector('.difficulty-btn.active');
      gameState.difficulty = selectedButton.dataset.level;
      
      // 更新难度按钮文本
      updateDifficultyButtonText();
      
      // 隐藏模态框
      difficultyModal.style.display = 'none';
      
      // 重新开始游戏
      initGame();
    });
    
    returnButton.addEventListener('click', () => {
      window.location.href = 'index.html';
    });
    
    // 初始化游戏
    initGame();
    updateDifficultyButtonText();
  </script>
</body>
</html>
